<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>खास सरप्राईज! | Surprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .award-card { width: 300px; height: 400px; perspective: 1000px; margin-top: 50px; }
        .award-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.8s; transform-style: preserve-3d; }
        .award-card:hover .award-inner { transform: rotateY(180deg); }
        .award-front, .award-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .award-front { background: linear-gradient(135deg, #ffd700, #b8860b); color: #333; border: 10px solid #fff; }
        .award-back { background: #fff; color: #1a2a6c; transform: rotateY(180deg); border: 5px solid #ffd700; }
        .next-btn { margin-top: 50px; background: white; color: #b21f1f; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-family: 'Khand'; font-weight: bold; font-size: 1.4rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.3s; }
        .next-btn:hover { transform: scale(1.1); background: #f1c40f; color: #000; }
    </style>
</head>
<body>

    <h1 style="font-family: 'Khand'; font-size: 3rem;">तुम्ही आहात आमचा अभिमान!</h1>

    <div class="award-card">
        <div class="award-inner">
            <div class="award-front">
                <h2 style="font-family: 'Khand';">सन्मानपत्र</h2>
                <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" width="120">
                <h3 style="font-family: 'Khand';">जगातील सर्वात भारी बाबा</h3>
            </div>
            <div class="award-back">
                <h3 style="font-family: 'Khand';">डिक्लेरेशन</h3>
                <p>"हे सन्मानपत्र माझ्या लाडक्या बाबांना, ज्यांनी शून्यातून जग निर्माण केलं आणि आम्हाला योग्य मार्ग दाखवला."</p>
                <p><strong>- तुमचा मुलगा</strong></p>
            </div>
        </div>
    </div>

    <p style="margin-top: 30px; font-family: 'Poppins';">कार्डवर माउस फिरवा किंवा टच करा (Flip it!)</p>

    <a href="letter.html" class="next-btn">बाबा, तुमच्यासाठी एक खास पत्र... ✉️</a>

</body>
</html>
